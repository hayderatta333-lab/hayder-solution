{% extends "base.html" %}
{% block title %}AI Agent - {{ app_name }}{% endblock %}
{% block content %}
<h3 class="mb-3">AI Sales Agent</h3>
<p class="text-muted">Yahan AI ko instructions likhein — WhatsApp integration Phase 2 mein add hoga.</p>

<div class="card">
  <div class="card-body">
    <form method="POST">
      <div class="form-check form-switch mb-3">
        <input class="form-check-input" type="checkbox" name="enabled" id="enabledSwitch" {% if settings and settings.enabled %}checked{% endif %}>
        <label class="form-check-label" for="enabledSwitch">AI Agent ON hai</label>
      </div>
      <div class="mb-3">
        <label class="form-label">AI ko Instructions (System Prompt)</label>
        <textarea class="form-control" name="system_prompt" rows="8">{{ settings.system_prompt if settings else '' }}</textarea>
      </div>
      <button type="submit" class="btn btn-primary">Save Karein</button>
    </form>
  </div>
</div>
{% endblock %}
